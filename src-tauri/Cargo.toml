# Standalone workspace so cargo does not search upward for a parent manifest.
[workspace]

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# Windows-only: disable WebView2 user zoom (pinch / Ctrl+wheel) via the
# ICoreWebView2Settings platform hook. Version matches what Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
