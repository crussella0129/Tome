<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img"
     aria-label="Tome pipeline: SUMMARY.md to parser to navigation tree to reader">
  <style>
    .ink   { fill: #2b2018; }
    .paper { fill: #f3e9d2; }
    .rule  { stroke: #2b2018; stroke-width: 1.5; fill: none; }
    .edge  { stroke: #cdbb95; stroke-width: 1; fill: none; }
    .accent{ fill: #a83a2b; }
    text   { font-family: 'Courier New', monospace; fill: #2b2018; }
    .lbl   { font-size: 14px; }
    .cap   { font-size: 11px; fill: #6b5d48; letter-spacing: 0.12em; }
  </style>

  <rect x="0.5" y="0.5" width="659" height="199" class="paper" stroke="#cdbb95"/>

  <text x="20" y="28" class="cap">TOME · PIPELINE</text>

  <!-- boxes -->
  <g>
    <rect x="20"  y="80" width="130" height="52" class="rule"/>
    <text x="85"  y="103" class="lbl" text-anchor="middle">SUMMARY.md</text>
    <text x="85"  y="120" class="cap" text-anchor="middle">the spine</text>

    <rect x="190" y="80" width="130" height="52" class="rule"/>
    <text x="255" y="103" class="lbl" text-anchor="middle">parseSummary</text>
    <text x="255" y="120" class="cap" text-anchor="middle">pure fn</text>

    <rect x="360" y="80" width="130" height="52" class="rule"/>
    <text x="425" y="103" class="lbl" text-anchor="middle">nav tree</text>
    <text x="425" y="120" class="cap" text-anchor="middle">TocSidebar</text>

    <rect x="510" y="80" width="130" height="52" class="rule"/>
    <text x="575" y="103" class="lbl" text-anchor="middle">Reader</text>
    <text x="575" y="120" class="cap" text-anchor="middle">ink on paper</text>
  </g>

  <!-- arrows -->
  <g class="rule">
    <line x1="150" y1="106" x2="188" y2="106"/>
    <line x1="320" y1="106" x2="358" y2="106"/>
    <line x1="490" y1="106" x2="508" y2="106"/>
  </g>
  <g class="accent">
    <path d="M188 106 l-9 -4 v8 z"/>
    <path d="M358 106 l-9 -4 v8 z"/>
    <path d="M508 106 l-9 -4 v8 z"/>
  </g>

  <text x="20" y="175" class="cap">▪ every box reads its colour from a --theme-* token</text>
</svg>
